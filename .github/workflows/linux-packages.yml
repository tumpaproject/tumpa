name: Build Linux packages

# Manual runs (Actions tab → "Run workflow") or a version tag push.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

# The release job needs to create/update a GitHub release on tag pushes.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # RPM-based distros — `just build-rpm` / `just build-almalinux`.
          - name: fedora-45
            recipe: build-rpm
            image: fedora:45
            glob: '*.rpm'
          - name: fedora-44
            recipe: build-rpm
            image: fedora:44
            glob: '*.rpm'
          - name: almalinux-10
            recipe: build-almalinux
            image: almalinux:10
            glob: '*.rpm'
          # DEB-based distros — `just build-deb`.
          - name: debian-13
            recipe: build-deb
            image: debian:13
            glob: '*.deb'
          - name: debian-sid
            recipe: build-deb
            image: debian:sid
            glob: '*.deb'
          - name: ubuntu-25.10
            recipe: build-deb
            image: ubuntu:25.10
            glob: '*.deb'
          - name: ubuntu-26.04
            recipe: build-deb
            image: ubuntu:26.04
            glob: '*.deb'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri + Rust builds inside Docker are large; reclaim space the
      # default runner image spends on toolchains we don't use here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      # Pinned release tarball, verified with sha256sum before extraction.
      # To bump: update JUST_VERSION and JUST_SHA256 from the release's
      # SHA256SUMS file (https://github.com/casey/just/releases).
      - name: Install just
        env:
          JUST_VERSION: 1.59.0
          JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
        run: |
          set -euo pipefail
          tarball="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfLO \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/${tarball}"
          echo "${JUST_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" just
          sudo install -m 0755 just /usr/local/bin/just
          rm -f just "${tarball}"
          just --version

      - name: Build package (${{ matrix.image }})
        run: just ${{ matrix.recipe }} ${{ matrix.image }}

      # Uploaded artifacts are downloadable from the workflow run page.
      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tumpa-${{ matrix.name }}
          path: dist/**/${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 30

  # On a tag push, gather every distro's packages and attach them to the
  # matching GitHub release so they are downloadable without digging into
  # the Actions run. Skipped for manual (workflow_dispatch) runs.
  release:
    name: Attach packages to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect packages
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.rpm' -o -name '*.deb' \) \
            -exec cp -v {} release/ \;
          ls -la release/

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Create the release if a tag push beat the manual release.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                 --title "$tag" --notes "Automated Linux package build for $tag."
          gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
